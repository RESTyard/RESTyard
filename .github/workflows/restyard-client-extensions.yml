name: RESTyard.Client.Extensions Build

on:
  push:
    branches: [ "main" ]
    paths:
      - './Source/*'
      - './Source/RESTyard.Client*/**'
      - './Source/RESTyard.Integration.Test/**'
  pull_request:
    branches: [ "develop" ]
    paths:
      - './Source/*'
      - './Source/RESTyard.Client*/**'
      - './Source/RESTyard.Integration.Test/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    - name: Restore dependencies
      run: dotnet restore ./Source
    - name: Build Client Extensions
      run: for proj in NewtonsoftJson SystemNetHttp SystemTextJson do; dotnet build ./Source/RESTyard.Client.Extensions/$proj/$proj.csproj --no-restore --configuration Release
    - name: Run Tests
      run: dotnet test ./Source/RESTyard.Client.Extensions/Extensions.Test/Extensions.Test.csproj --configuration Release
    - name: Pack
      run: for proj in NewtonsoftJson SystemNetHttp SystemTestJson do; dotnet pack ./Source/RESTyard.Client.Extensions/$proj/$proj.csproj --no-build --configuration Release --output artifacts
    - uses: actions/upload-artifact@v4
      if: github.event_name != 'pull_request'
      with:
        name: packages
        path: artifacts/*.nupkg