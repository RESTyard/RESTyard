name: RESTyard.AspNetCore Build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Source/*'
      - 'Source/RESTyard.AspNetCore*/**'
      - 'Source/RESTyard.Integration.Test/**'
      - '.github/workflows/restyard-aspnetcore.yml'
  pull_request:
    branches: [ "develop" ]
    paths:
      - 'Source/*'
      - 'Source/RESTyard.AspNetCore*/**'
      - 'Source/RESTyard.Integration.Test/**'      
      - '.github/workflows/restyard-aspnetcore.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    - name: Restore dependencies
      run: dotnet restore ./Source
    - name: Build RESTyard
      run: dotnet build ./Source --no-restore --configuration Release
    - name: Run Tests
      run: for proj in RESTyard.AspNetCore.Test RESTyard.AspNetCore.Analyzers.Tests RESTyard.Integration.Test; do dotnet test ./Source/$proj/$proj.csproj --configuration Release; done
    - name: Pack
      run: dotnet pack ./Source/RESTyard.AspNetCore/RESTyard.AspNetCore.csproj --no-build --configuration Release --output artifacts
    - uses: actions/upload-artifact@v4
      if: github.event_name != 'pull_request'
      with:
        name: packages
        path: artifacts/*.nupkg